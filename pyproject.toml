[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-dock"
version = "0.1.0"
description = "Reusable multi-bot Telegram gateway"
requires-python = ">=3.10"
dependencies = ["aiogram>=3.13,<4", "fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["bot_dock*"]
